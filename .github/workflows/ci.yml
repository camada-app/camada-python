name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with: { path: camada-python }
      # The golden snapshot fixtures the suite is pinned to, and the beacon build the package vendors.
      - uses: actions/checkout@v4
        with: { repository: ${{ github.repository_owner }}/camada-core, path: camada-core }
      - uses: actions/checkout@v4
        with: { repository: ${{ github.repository_owner }}/camada-browser, path: camada-browser }
      - uses: actions/setup-node@v4
        with: { node-version: 22.x }
      - run: npm install && npm run build
        working-directory: camada-browser
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with: { python-version: ${{ matrix.python }} }
      - run: uv sync
        working-directory: camada-python
      - run: uv run ruff check
        working-directory: camada-python
      - run: uv run mypy
        working-directory: camada-python
      - run: uv run pytest
        working-directory: camada-python
