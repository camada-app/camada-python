name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with: { path: camada-python }
      # The suite reads golden fixtures from camada-core and pins camada-browser to the vendored release tag.
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/camada-core
          path: camada-core
      - id: beacon
        run: |
          v=$(sed -n "s/^BEACON_VERSION = '\([^']*\)'$/\1/p" camada-python/src/camada/beacon_js.py)
          [ -n "$v" ] || { echo "::error::no vendored beacon version in camada-python/src/camada/beacon_js.py"; exit 1; }
          echo "ref=v$v" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/camada-browser
          ref: ${{ steps.beacon.outputs.ref }}
          path: camada-browser
      - uses: actions/setup-node@v7
        with: { node-version: 22.x }
      - run: npm install && npm run build
        working-directory: camada-browser
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
        working-directory: camada-python
      - run: uv run ruff check
        working-directory: camada-python
      - run: uv run mypy
        working-directory: camada-python
      - run: uv run pytest
        working-directory: camada-python
