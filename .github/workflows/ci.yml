name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with: { path: camada-python }
      # Golden snapshot fixtures pinned to a camada-core commit (see README for how to bump it).
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/camada-core
          ref: 08649b21b56804cdb1abbce52b456d3d11e047a8
          path: camada-core
      # Beacon pinned to its vendored release tag.
      - id: beacon
        run: |
          f=camada-python/src/camada/beacon_js.py
          v=$(sed -n "s/^BEACON_VERSION = '\([^']*\)'$/\1/p" "$f")
          [ -n "$v" ] || { echo "::error::no vendored beacon version in $f"; exit 1; }
          echo "ref=v$v" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/camada-browser
          path: camada-browser
          ref: ${{ steps.beacon.outputs.ref }}
      - uses: actions/setup-node@v7
        with: { node-version: 22.x }
      - run: npm install && npm run build
        working-directory: camada-browser
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
        working-directory: camada-python
      - run: uv run ruff check
        working-directory: camada-python
      - run: uv run mypy
        working-directory: camada-python
      - run: uv run pytest
        working-directory: camada-python
